corpus:
  raw_dir: data/raw
  docs_dir: data/docs
  index_dir: data/index
chunking:
  chunk_tokens: 500
  overlap_tokens: 80
embedding:
  model: BAAI/bge-small-en-v1.5
  query_prefix: 'Represent this sentence for searching relevant passages: '
retrieval:
  top_k: 4
generation:
  prompt_version: v1
  max_tokens: 350
  temperature: 0.0
  local_model_path: models/qwen2.5-3b-instruct-q4_k_m.gguf
  local_model_name: Qwen2.5-3B-Instruct (GGUF Q4_K_M, llama.cpp)
  claude_model: claude-sonnet-4-5
  n_ctx: 4096
  n_threads: 8
gate:
  min_retrieval_score: 0.7
  require_citation: true
  escalate_on_idk: true
judge:
  local_model_path: models/Phi-3.5-mini-instruct-Q4_K_M.gguf
  local_model_name: Phi-3.5-mini-instruct (GGUF Q4_K_M, llama.cpp)
  claude_model: claude-sonnet-4-5
pricing_usd_per_mtok:
  claude-sonnet-4-5:
    input: 3.0
    output: 15.0
review_queue:
  db_path: data/review_queue.sqlite
